MCeditor.addEventListener('cut',function(MCe){var MCkey=MCselectedToken();if(MCkey){MCe.preventDefault();MCe.clipboardData.setData('text/plain','{{'+MCkey+'}}');window.getSelection().getRangeAt(0).deleteContents();MCchanged()}});
MCeditor.addEventListener('paste',function(MCe){var MCtext=MCe.clipboardData&&MCe.clipboardData.getData('text/plain');if(MCtext&&/^\{\{[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)?\}\}$/.test(MCtext)){MCe.preventDefault();MCinsert(MCtext.slice(2,-2))}});
})();
</script></body></html>
